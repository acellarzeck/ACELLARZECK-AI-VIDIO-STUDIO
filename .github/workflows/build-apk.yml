
name: Build ACELLARZECK APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          mkdir unpacked
          unzip -q android-project.zip -d unpacked
          cd unpacked/ACELLARZECK_AI_VIDEO_STUDIO_ANDROID_V2.1
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACELLARZECK-APK
          path: app-debug.apk

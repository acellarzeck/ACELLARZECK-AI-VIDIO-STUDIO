name: Build ACELLARZECK APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android Project
        run: |
          mkdir -p unpacked
          unzip -q android-project.zip -d unpacked

      - name: Find Gradle Wrapper
        run: |
          find unpacked -type f -name gradlew -print

      - name: Build APK
        run: |
          WRAPPER=$(find unpacked -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew tidak ditemukan"
            find unpacked -maxdepth 5 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACELLARZECK-APK
          path: app-debug.apk
          if-no-files-found: error
